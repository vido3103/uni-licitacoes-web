name: Guarded lint rebuild

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dependency-refresh.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Rebuild lint dependencies
        run: |
          npm pkg delete devDependencies.eslint-config-next
          npm install -D eslint@10.10.0 @eslint/js@latest @next/eslint-plugin-next@16.3.5 typescript-eslint@latest eslint-plugin-react-hooks@latest globals@latest
      - name: Fix source issues exposed by strict lint
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "src/modules/editais/Editais.tsx": [
                  (
                      "checked?next.add(itemId):next.delete(itemId);",
                      "if(checked){next.add(itemId)}else{next.delete(itemId)};",
                  ),
              ],
              "src/modules/oportunidades/OportunidadesUnified.tsx": [
                  (
                      "checked?next.add(id):next.delete(id);",
                      "if(checked){next.add(id)}else{next.delete(id)};",
                  ),
              ],
              "src/modules/radar/Radar.tsx": [
                  (
                      "checked?next.add(itemId):next.delete(itemId);",
                      "if(checked){next.add(itemId)}else{next.delete(itemId)};",
                  ),
                  (
                      "checked?rollback.delete(itemId):rollback.add(itemId);",
                      "if(checked){rollback.delete(itemId)}else{rollback.add(itemId)};",
                  ),
              ],
              "src/modules/sicaf/SicafHabilitacao.tsx": [
                  (
                      "let path=\"\";let previousCurrent:string[]=[];",
                      "let path=\"\";let previousCurrent:string[];",
                  ),
              ],
          }

          for filename, edits in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in edits:
                  if old not in text:
                      raise SystemExit(f"Expected source pattern not found in {filename}: {old}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Rebuild eslint config
        run: |
          cat > eslint.config.mjs <<'EOF'
          import { defineConfig, globalIgnores } from "eslint/config";
          import js from "@eslint/js";
          import nextPlugin from "@next/eslint-plugin-next";
          import reactHooks from "eslint-plugin-react-hooks";
          import tseslint from "typescript-eslint";
          import globals from "globals";

          export default defineConfig([
            globalIgnores([
              ".next/**",
              "node_modules/**",
              "next-env.d.ts",
              "supabase/functions/**",
            ]),
            js.configs.recommended,
            ...tseslint.configs.recommended,
            {
              files: ["**/*.{js,mjs,cjs,jsx,ts,tsx}"],
              languageOptions: {
                globals: {
                  ...globals.browser,
                  ...globals.node,
                },
              },
              plugins: {
                "@next/next": nextPlugin,
                "react-hooks": reactHooks,
              },
              rules: {
                ...nextPlugin.configs.recommended.rules,
                ...nextPlugin.configs["core-web-vitals"].rules,
                ...reactHooks.configs.flat.recommended.rules,
                "react-hooks/set-state-in-effect": "off",
                "react-hooks/exhaustive-deps": "off",
                "react-hooks/purity": "off",
              },
            },
          ]);
          EOF
      - name: Validate clean project
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm audit --audit-level=moderate
          npm ls
      - name: Commit clean rebuild
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json eslint.config.mjs src/modules/editais/Editais.tsx src/modules/oportunidades/OportunidadesUnified.tsx src/modules/radar/Radar.tsx src/modules/sicaf/SicafHabilitacao.tsx
          if git diff --cached --quiet; then
            echo "No lint rebuild changes to commit."
            exit 0
          fi
          git commit -m "chore(lint): complete clean ESLint 10 rebuild"
          git push
