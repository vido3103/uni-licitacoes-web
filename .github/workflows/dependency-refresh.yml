name: Guarded dependency refresh

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dependency-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install compatible stable updates
        run: |
          npm install next@16.3.5 react@19.3.0 react-dom@19.3.0 @supabase/supabase-js@2.116.0
          npm install -D @types/node@24 @types/react@19 @types/react-dom@19 'typescript@^5'
      - name: Validate updated dependency set
        run: npm run check
      - name: Commit validated dependency updates
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(deps): refresh stable runtime dependencies"
          git push
