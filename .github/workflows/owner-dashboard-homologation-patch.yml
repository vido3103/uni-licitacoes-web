name: Owner dashboard homologation patch

on:
  push:
    paths:
      - '.github/owner-dashboard-homologation.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Owner dashboard
        run: python scripts/owner_dashboard_homologation_patch.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/admin/OwnerAdminV2.tsx
          git commit -m "fix(owner): homologate dashboard data integrity"
          git push origin HEAD:main
